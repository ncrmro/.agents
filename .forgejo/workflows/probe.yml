# Temporary diagnostic round 2. Delete after use.
name: probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.forgejo/workflows/probe.yml]
jobs:
  token-fetch:
    runs-on: native
    enable-openid-connect: true
    timeout-minutes: 5
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch OIDC token only
        env:
          KUBE_OIDC_AUDIENCE: kubernetes-ocean
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?OIDC request URL unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?OIDC request token unavailable}"
          curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${KUBE_OIDC_AUDIENCE}" > /tmp/tok.json
          grep -q '"value"' /tmp/tok.json && echo "token fetched"
  ca-file:
    runs-on: native
    timeout-minutes: 5
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: ls -la .forgejo/ocean-server-ca.crt
