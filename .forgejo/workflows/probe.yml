# Temporary diagnostic round 3: auth vs authz vs action. Delete after use.
name: probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.forgejo/workflows/probe.yml]
jobs:
  whoami:
    runs-on: native
    enable-openid-connect: true
    timeout-minutes: 5
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned kubectl and jq
        env:
          BIN: ${{ runner.temp }}/bin
          KUBECTL_VERSION: v1.35.4
          JQ_VERSION: jq-1.7.1
          JQ_SHA256: 5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5
        run: |
          set -euo pipefail
          mkdir -p "$BIN"
          curl --fail --silent --show-error --location \
            --output "$BIN/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl --fail --silent --show-error --location \
            --output "$BIN/kubectl.sha256" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          printf '%s  %s\n' "$(cat "$BIN/kubectl.sha256")" "$BIN/kubectl" |
            sha256sum --check --strict
          curl --fail --silent --show-error --location \
            --output "$BIN/jq" \
            "https://github.com/jqlang/jq/releases/download/${JQ_VERSION}/jq-linux-amd64"
          printf '%s  %s\n' "$JQ_SHA256" "$BIN/jq" | sha256sum --check --strict
          chmod 0700 "$BIN/kubectl" "$BIN/jq"
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Point kubectl at ocean as the deploy identity
        env:
          KUBE_SERVER: https://100.64.0.6:6443
          KUBE_OIDC_AUDIENCE: kubernetes-ocean
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?Forgejo Actions OIDC request URL is unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?Forgejo Actions OIDC request token is unavailable}"
          oidc_token="$(
            curl --fail --silent --show-error \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${KUBE_OIDC_AUDIENCE}" | jq -er .value
          )"
          kubeconfig="${RUNNER_TEMP:-/tmp}/deploy-kubeconfig"
          touch "$kubeconfig" && chmod 0600 "$kubeconfig"
          export KUBECONFIG="$kubeconfig"
          kubectl config set-cluster ocean \
            --server="$KUBE_SERVER" \
            --certificate-authority="$PWD/.forgejo/ocean-server-ca.crt" \
            --embed-certs >/dev/null
          kubectl config set-credentials deploy --token="$oidc_token" >/dev/null
          kubectl config set-context ocean --cluster=ocean --user=deploy >/dev/null
          kubectl config use-context ocean >/dev/null
      - name: Authenticated at all
        run: |
          export KUBECONFIG="${{ runner.temp }}/deploy-kubeconfig"
          kubectl auth whoami
  get-org:
    runs-on: native
    enable-openid-connect: true
    timeout-minutes: 5
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned kubectl and jq
        env:
          BIN: ${{ runner.temp }}/bin
          KUBECTL_VERSION: v1.35.4
          JQ_VERSION: jq-1.7.1
          JQ_SHA256: 5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5
        run: |
          set -euo pipefail
          mkdir -p "$BIN"
          curl --fail --silent --show-error --location \
            --output "$BIN/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl --fail --silent --show-error --location \
            --output "$BIN/kubectl.sha256" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          printf '%s  %s\n' "$(cat "$BIN/kubectl.sha256")" "$BIN/kubectl" |
            sha256sum --check --strict
          curl --fail --silent --show-error --location \
            --output "$BIN/jq" \
            "https://github.com/jqlang/jq/releases/download/${JQ_VERSION}/jq-linux-amd64"
          printf '%s  %s\n' "$JQ_SHA256" "$BIN/jq" | sha256sum --check --strict
          chmod 0700 "$BIN/kubectl" "$BIN/jq"
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Point kubectl at ocean as the deploy identity
        env:
          KUBE_SERVER: https://100.64.0.6:6443
          KUBE_OIDC_AUDIENCE: kubernetes-ocean
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?Forgejo Actions OIDC request URL is unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?Forgejo Actions OIDC request token is unavailable}"
          oidc_token="$(
            curl --fail --silent --show-error \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${KUBE_OIDC_AUDIENCE}" | jq -er .value
          )"
          kubeconfig="${RUNNER_TEMP:-/tmp}/deploy-kubeconfig"
          touch "$kubeconfig" && chmod 0600 "$kubeconfig"
          export KUBECONFIG="$kubeconfig"
          kubectl config set-cluster ocean \
            --server="$KUBE_SERVER" \
            --certificate-authority="$PWD/.forgejo/ocean-server-ca.crt" \
            --embed-certs >/dev/null
          kubectl config set-credentials deploy --token="$oidc_token" >/dev/null
          kubectl config set-context ocean --cluster=ocean --user=deploy >/dev/null
          kubectl config use-context ocean >/dev/null
      - name: Authorized for the org CR
        run: |
          export KUBECONFIG="${{ runner.temp }}/deploy-kubeconfig"
          kubectl get organizations.aioutfitter.com ncrmro -o name
          kubectl get agents.aioutfitter.com luce -o name
