# Deploys every resident agent this catalog declares to ocean when the
# catalog changes. The tree decides what deploys: each
# agents/<id>/deployment.yaml is one agent, and the deploy-catalog action
# globs exactly that path.
#
# This repository is canonical on GitHub (ncrmro/.agents) and mirrored into
# git.ncrmro.com, where this workflow runs — GitHub-hosted runners cannot
# reach ocean, and the mirror gives the same Forgejo Actions OIDC identity
# every other catalog uses.
#
# ── GATES — all cleared 2026-08-15 ──────────────────────────────────────────
# 1. Ocean runs the aioutfitter.com operator (the migration landed).
# 2. The mirror repository exists on git.ncrmro.com (pull mirror, 10m sync)
#    with Actions enabled.
# 3. The trust in deploy/rbac.yaml is admin-applied.
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - agents/**
      - skills/**
      - .forgejo/workflows/deploy.yml

jobs:
  deploy:
    name: Deploy the catalog revision to ocean
    # `native` runs on the ocean host, where the runner's instance URL is
    # Forgejo itself and the Kubernetes API is local — the docker-backed
    # labels can reach neither.
    runs-on: native
    enable-openid-connect: true
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Identity: Forgejo Actions OIDC straight to the Kubernetes API — no
      # kubeconfig secret, no stored cluster credential. The action asserts
      # what this identity can and cannot do; establishing it is this step's
      # job. jq is required by the action and used here too.
      # The native host ships neither kubectl nor jq (runs 1–9 of this
      # workflow bisected to exactly that: any step piping through jq failed
      # in under a second with no readable logs — the old fleet leg parsed
      # JSON with node for the same reason). Install both pinned into the
      # runner's temp dir; kubectl verifies against its published .sha256
      # (vega's pattern), jq against a checksum recorded at pin time.
      # GITHUB_PATH makes them visible to the deploy-catalog action, which
      # preflights for both.
      - name: Install pinned kubectl and jq
        env:
          BIN: ${{ runner.temp }}/bin
          KUBECTL_VERSION: v1.35.4
          JQ_VERSION: jq-1.7.1
          JQ_SHA256: 5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5
        run: |
          set -euo pipefail
          mkdir -p "$BIN"
          curl --fail --silent --show-error --location \
            --output "$BIN/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl --fail --silent --show-error --location \
            --output "$BIN/kubectl.sha256" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          printf '%s  %s\n' "$(cat "$BIN/kubectl.sha256")" "$BIN/kubectl" |
            sha256sum --check --strict
          curl --fail --silent --show-error --location \
            --output "$BIN/jq" \
            "https://github.com/jqlang/jq/releases/download/${JQ_VERSION}/jq-linux-amd64"
          printf '%s  %s\n' "$JQ_SHA256" "$BIN/jq" | sha256sum --check --strict
          chmod 0700 "$BIN/kubectl" "$BIN/jq"
          echo "$BIN" >> "$GITHUB_PATH"

      # Identity: Forgejo Actions OIDC straight to the Kubernetes API — no
      # kubeconfig secret, no stored cluster credential. Token exchange is
      # the same one the retired fleet leg performed; the action asserts what
      # this identity can and cannot do, establishing it is this step's job.
      - name: Point kubectl at ocean as the deploy identity
        env:
          KUBE_SERVER: https://100.64.0.6:6443
          KUBE_OIDC_AUDIENCE: kubernetes-ocean
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?Forgejo Actions OIDC request URL is unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?Forgejo Actions OIDC request token is unavailable}"
          oidc_token="$(
            curl --fail --silent --show-error \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${KUBE_OIDC_AUDIENCE}" | jq -er .value
          )"
          kubeconfig="${RUNNER_TEMP:-/tmp}/deploy-kubeconfig"
          touch "$kubeconfig" && chmod 0600 "$kubeconfig"
          export KUBECONFIG="$kubeconfig"
          kubectl config set-cluster ocean \
            --server="$KUBE_SERVER" \
            --certificate-authority="$PWD/.forgejo/ocean-server-ca.crt" \
            --embed-certs >/dev/null
          kubectl config set-credentials deploy --token="$oidc_token" >/dev/null
          kubectl config set-context ocean --cluster=ocean --user=deploy >/dev/null
          kubectl config use-context ocean >/dev/null
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      # Exact-SHA pin, updated deliberately: the action patches custom
      # resources whose API group already changed once, so the deploy step
      # and the CRDs it patches move as one bump. Fully qualified because a
      # bare `uses:` resolves against the Forgejo instance, not github.com.
      - name: Deploy the catalog revision
        uses: https://github.com/ai-outfitter/agent-operator/actions/deploy-catalog@b4228496b6b3dfd26b98c68e49c433f5d631b0c1
        with:
          revision: ${{ github.sha }}
          catalog-source: ncrmro-agents
          field-manager: agents-catalog-deploy
