# Deploy identity for this catalog's Actions workflow
# (.forgejo/workflows/deploy.yml, running on the git.ncrmro.com mirror) —
# the catalog deploying its own resident agents via agent-operator's
# deploy-catalog action. The trust lives beside the tree it mirrors, but it
# is **admin-applied**:
#
#   kubectl --context default apply --server-side -f deploy/rbac.yaml
#
# CI cannot apply it — the deploy identity holds no RBAC verbs — so granting
# or widening trust stays a two-person change even though the file lives in
# the repository whose workflow it empowers. Same shape as every other
# catalog's deploy/rbac.yaml: OIDC-only identity, named objects only, no
# create, no delete, no Secrets.
#
# Effective only after the ocean operator migration (the rules name the
# aioutfitter.com API group) and after the mirror repository exists on
# git.ncrmro.com — the subject embeds the mirror's owner/repo path.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ncrmro-agents-catalog-forgejo-deployer
rules:
  - apiGroups: ["aioutfitter.com"]
    resources: ["agents"]
    resourceNames: ["luce"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["aioutfitter.com"]
    resources: ["organizations"]
    resourceNames: ["ncrmro"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ncrmro-agents-catalog-forgejo-deployer
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io

    name: oidc:forgejo:repo:ncrmro/.agents:subject:repo:ncrmro/.agents:ref:refs/heads/main:event:push:workflow:ncrmro/.agents/.forgejo/workflows/deploy.yml@refs/heads/main
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: oidc:forgejo:repo:ncrmro/.agents:subject:repo:ncrmro-1/.agents-46:ref:refs/heads/main:event:push:workflow:ncrmro/.agents/.forgejo/workflows/deploy.yml@refs/heads/main
  - kind: Group
    apiGroup: rbac.authorization.k8s.io

    name: oidc:forgejo:repo:ncrmro/.agents:subject:repo:ncrmro/.agents:ref:refs/heads/main:event:workflow_dispatch:workflow:ncrmro/.agents/.forgejo/workflows/deploy.yml@refs/heads/main
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: oidc:forgejo:repo:ncrmro/.agents:subject:repo:ncrmro-1/.agents-46:ref:refs/heads/main:event:workflow_dispatch:workflow:ncrmro/.agents/.forgejo/workflows/deploy.yml@refs/heads/main
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ncrmro-agents-catalog-forgejo-deployer
---
# Namespace-scoped grants: the runtime ConfigMap by name, plus unscoped
# get/list/watch on rollout objects (rollout status LISTs first; a
# names-scoped rule denies the watch — see the ks.systems file).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ncrmro-agents-catalog-forgejo-deployer
  namespace: agent-luce
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["luce-runtime"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ncrmro-agents-catalog-forgejo-deployer
  namespace: agent-luce
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io

    name: oidc:forgejo:repo:ncrmro/.agents:subject:repo:ncrmro/.agents:ref:refs/heads/main:event:push:workflow:ncrmro/.agents/.forgejo/workflows/deploy.yml@refs/heads/main
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: oidc:forgejo:repo:ncrmro/.agents:subject:repo:ncrmro-1/.agents-46:ref:refs/heads/main:event:push:workflow:ncrmro/.agents/.forgejo/workflows/deploy.yml@refs/heads/main
  - kind: Group
    apiGroup: rbac.authorization.k8s.io

    name: oidc:forgejo:repo:ncrmro/.agents:subject:repo:ncrmro/.agents:ref:refs/heads/main:event:workflow_dispatch:workflow:ncrmro/.agents/.forgejo/workflows/deploy.yml@refs/heads/main
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: oidc:forgejo:repo:ncrmro/.agents:subject:repo:ncrmro-1/.agents-46:ref:refs/heads/main:event:workflow_dispatch:workflow:ncrmro/.agents/.forgejo/workflows/deploy.yml@refs/heads/main
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ncrmro-agents-catalog-forgejo-deployer
